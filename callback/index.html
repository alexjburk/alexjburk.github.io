<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Tesla auth callback</title></head>
<body style="font-family:sans-serif;max-width:44em;margin:3em auto">
<h1>Tesla authorization</h1><div id="out"></div>
<script>
const p = new URLSearchParams(location.search), o = document.getElementById('out');
function row(label, val){ const d=document.createElement('div'); d.innerHTML='<p><b>'+label+'</b></p>'; const t=document.createElement('textarea'); t.readOnly=true; t.rows=3; t.style.width='100%'; t.value=val; t.onclick=()=>t.select(); d.appendChild(t); o.appendChild(d); }
if (p.get('error')) row('Error', p.get('error')+': '+(p.get('error_description')||''));
else if (p.get('code')) { row('Code (copy this)', p.get('code')); row('State', p.get('state')||''); }
else o.textContent = 'No code in URL.';
history.replaceState(null, '', location.pathname);
</script></body></html>
